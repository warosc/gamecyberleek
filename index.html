<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required on notched iPhones: without it Safari insets the page
         to the safe area in landscape, which shows up as black bars down both sides. -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Retained for iOS versions that predate the standard name above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>LEEK OPS</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-device" aria-live="polite">
      <strong>GIRA TU DISPOSITIVO</strong>
      <span>LEEK OPS se juega en horizontal</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
