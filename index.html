<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required on notched iPhones: without it Safari insets the page
         to the safe area in landscape, which shows up as black bars down both sides. -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Retained for iOS versions that predate the standard name above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>LEEK OPS</title>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-grid"></div>
      <div class="boot-mark" aria-hidden="true"><span></span></div>
      <strong>CYBERLEEK</strong>
      <small>LEEK OPS // INICIALIZANDO BIO-SISTEMAS</small>
      <div class="boot-track"><i id="boot-progress"></i></div>
      <span id="boot-status">CARGANDO NÚCLEO TÁCTICO...</span>
    </div>
    <div id="game"></div>
    <div id="rotate-device" aria-live="polite">
      <strong>GIRA TU DISPOSITIVO</strong>
      <span>LEEK OPS se juega en horizontal</span>
    </div>
    <script>
      // The splash and the rotate notice show before the game's i18n loads, so they read the saved
      // language here. English players used to see them in Spanish on every load.
      try {
        var saved = JSON.parse(localStorage.getItem('leek-ops-profile-v5') || '{}');
        if (saved && saved.settings && saved.settings.locale === 'en') {
          document.documentElement.lang = 'en';
          var texts = {
            '#boot-splash small': 'LEEK OPS // BOOTING BIO-SYSTEMS',
            '#boot-status': 'LOADING TACTICAL CORE...',
            '#rotate-device strong': 'ROTATE YOUR DEVICE',
            '#rotate-device span': 'LEEK OPS is played in landscape',
          };
          for (var selector in texts) {
            var node = document.querySelector(selector);
            if (node) node.textContent = texts[selector];
          }
        }
      } catch (error) {
        // Unreadable storage: keep the Spanish defaults.
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
