# The client address the online API sees. Requests through the Cloudflare tunnel reach this
# container from the Docker gateway (cloudflared runs on the host), and only for those is
# Cf-Connecting-Ip trusted; anything arriving straight on :8090 keeps its own address, so a
# client cannot pick its IP by sending the header itself.
map $remote_addr $leek_client_ip {
  ~^172\.(1[6-9]|2[0-9]|3[01])\. $http_cf_connecting_ip;
  default $remote_addr;
}
# A player sends about one request a second during a daily run (live board poll and update).
limit_req_zone $leek_client_ip zone=leek_api:10m rate=5r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml audio/midi;
  gzip_min_length 1024;

  # Never cache the entry points: a deploy must reach players on their next load.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Vite's own bundles (assets/<name>-<hash>.js|css) are fingerprinted and can be cached for a
  # year. Files copied from public/assets/ (sprites, music, manifests) keep stable names, so they
  # use the default revalidating cache and a deploy can replace them.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Online API: PostgREST on the private leek-ops-net network, only its RPC functions, only POST.
  # Not under /api: the Cloudflare tunnel still routes tienda.opticaoptimus.com/api* to the old
  # store's backend, so requests there never reach this server.
  # The upstream is resolved per request, so the game still starts and serves when the backend is
  # down; the client treats the resulting 502 as "offline".
  location /online/rpc/ {
    limit_except POST { deny all; }
    limit_req zone=leek_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 96k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $leek_api leek-ops-api:3000;
    rewrite ^/online/(.*)$ /$1 break;
    proxy_pass http://$leek_api;
    proxy_set_header X-Client-Ip $leek_client_ip;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cf-Connecting-Ip "";
    proxy_set_header X-Real-Ip "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
  location /online/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
