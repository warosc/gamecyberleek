<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>LEEK OPS · Sin conexión</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: #07111f; color: #eaffff; font-family: "Arial Black", Arial, sans-serif; text-align: center;
    }
    main { max-width: 440px; border: 2px solid #21e6ff55; padding: 32px 24px; background: #06101d; }
    h1 { color: #73ef62; font-size: 40px; margin: 0 0 8px; letter-spacing: 2px; }
    p { color: #a9bbc9; font-family: Arial, sans-serif; line-height: 1.5; margin: 12px 0; }
    .en { color: #7594a8; font-size: 14px; }
    button {
      margin-top: 16px; min-height: 48px; padding: 0 28px; font: inherit; font-size: 16px; letter-spacing: 2px;
      color: #eaffff; background: #07111f; border: 3px solid #73ef62; cursor: pointer;
    }
    button:hover, button:focus-visible { background: #73ef6233; outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>LEEK OPS</h1>
    <p>Sin conexión. El juego necesita cargarse una vez con internet; después funciona sin conexión.</p>
    <p class="en">Offline. The game needs to load once with a connection; after that it plays offline.</p>
    <button type="button" onclick="location.reload()">REINTENTAR · RETRY</button>
  </main>
</body>
</html>
