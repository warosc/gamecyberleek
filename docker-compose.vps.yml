services:
  game:
    container_name: leek-ops-game
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    image: leek-ops-game:current
    restart: unless-stopped
    ports:
      - "8090:80"
    # Shared with the online backend (server/docker-compose.online.yml) so nginx can reach PostgREST.
    networks: [default, leek-ops-net]
networks:
  leek-ops-net:
    external: true
